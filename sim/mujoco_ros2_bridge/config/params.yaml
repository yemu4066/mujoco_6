# mujoco_node 的默认参数。
# 导航栈只依赖它发布的 odom / TF / ObstacleArray，不依赖任何仿真内部量。
mujoco_node:
  ros__parameters:
    scene: rc2027/scene_nav.xml     # 相对本包 model/ 目录
    use_viewer: true
    steer_rate_limit: 8.0
    steer_noise_std: 0.002
    drive_noise_std: 0.02   # 原 0.1，逐位噪声会让车直线抖动

    # ---- 两个 650×650 移动对手 ----
    # L1（z=0.625 台面）：对方半场西侧走廊 + 北侧公共边缘，L 形折返
    # L2（z=0.925 台面）：绕中央基座环行（公共区）
    obstacle_l1_speed: 0.5
    obstacle_l2_speed: 0.2
    obstacle_l2_orbit_radius: 0.85
    obstacle_height: 0.5

    # ---- 障碍发布 ----
    # 可动比赛用品（天空块/地块/五色石）也会作为障碍发布，
    # 这样被机器人推开后，代价地图的障碍层会自动更新。
    publish_movable_objects: true
    obstacle_rate: 20.0

    # 仿真没有定位系统，用 identity 把 map 与 odom 接起来
    publish_map_to_odom: true
